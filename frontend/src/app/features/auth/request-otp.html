<app-auth-layout>
  <h1>Hungry? Let's get started.</h1>
  <p class="sub">Enter your email and we'll send you a code.</p>

  <mat-form-field appearance="outline" class="field">
    <mat-label>Email</mat-label>
    <input matInput type="email" [formControl]="email" (keydown.enter)="submit()" />
    @if (email.invalid && email.touched) {
      <mat-error>Enter a valid email</mat-error>
    }
  </mat-form-field>

  @if (errorMsg()) {
    <p class="error">{{ errorMsg() }}</p>
  }

  <button
    mat-flat-button
    color="primary"
    class="submit"
    [disabled]="email.invalid || loading()"
    (click)="submit()"
  >
    @if (loading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Send code
    }
  </button>

  <p class="legal">
    By continuing you agree to our <a routerLink="/terms">Terms &amp; Conditions</a>.
  </p>
</app-auth-layout>
