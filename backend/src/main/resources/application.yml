spring:
  application:
    name: relish
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:relish}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # SMTP reachability isn't critical to app health here — OTP_LOG_TO_CONSOLE is the
    # deliberate fallback for when mail isn't configured (local/demo use).
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

relish:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    # only has to outlive reading the terms page
    registration-ttl-minutes: ${JWT_REGISTRATION_TTL_MIN:10}
  otp:
    ttl-minutes: 5
    max-attempts: 5
    log-to-console: ${OTP_LOG_TO_CONSOLE:false}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4201}
